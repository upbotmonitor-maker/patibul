<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Bakımda - PatiBul</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Genel Ayarlar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #334155;
        }

        /* Kart Tasarımı */
        .maintenance-card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* Başlık ve İkon */
        .header-icon {
            font-size: 50px;
            color: #3b82f6;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #1e293b;
            margin-bottom: 10px;
            font-weight: 700;
        }

        p.desc {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Form Elemanları */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .input-group label i {
            margin-right: 5px;
            color: #3b82f6;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input,
        .input-wrapper textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus,
        .input-wrapper textarea:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Gönder Butonu */
        button {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        /* Bildirim Alanı */
        #mesajAlani {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            padding: 10px;
            border-radius: 8px;
            display: none; /* Başlangıçta gizli */
        }

        .basarili {
            background-color: #dcfce7;
            color: #166534;
            display: block !important;
        }

        .hata {
            background-color: #fee2e2;
            color: #991b1b;
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <i class="fa-solid fa-server header-icon"></i>
        <h1>Sistem Bakımda</h1>
        <p class="desc">
            Sizlere daha iyi hizmet verebilmek için altyapımızı güncelliyoruz. 
            Bu süreçte bizimle iletişime geçmek isterseniz aşağıdaki formu kullanabilirsiniz.
        </p>
        
        <form id="destekFormu">
            <div class="input-group">
                <label for="mail"><i class="fa-solid fa-envelope"></i> E-posta Adresiniz</label>
                <div class="input-wrapper">
                    <input type="email" id="mail" required placeholder="Size ulaşabileceğimiz bir adres girin...">
                </div>
            </div>

            <div class="input-group">
                <label for="konu"><i class="fa-solid fa-heading"></i> Konu</label>
                <div class="input-wrapper">
                    <input type="text" id="konu" required placeholder="Mesajınızın konusu nedir?">
                </div>
            </div>

            <div class="input-group">
                <label for="detay"><i class="fa-solid fa-comment-dots"></i> Mesajınız</label>
                <div class="input-wrapper">
                    <textarea id="detay" rows="4" required placeholder="Lütfen detayları buraya yazın..."></textarea>
                </div>
            </div>

            <button type="submit" id="gonderBtn">
                <i class="fa-solid fa-paper-plane"></i> Mesajı Gönder
            </button>

            <div id="mesajAlani"></div>
        </form>
    </div>

    <script>
        document.getElementById('destekFormu').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('gonderBtn');
            const mesajAlani = document.getElementById('mesajAlani');
            
            const mail = document.getElementById('mail').value;
            const konu = document.getElementById('konu').value;
            const detay = document.getElementById('detay').value;

            // Butonu yükleniyor durumuna al (İkonu değiştiriyoruz)
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Gönderiliyor...';
            mesajAlani.className = '';
            mesajAlani.style.display = 'none';

            try {
                const response = await fetch('/destek-talebi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mail, konu, detay })
                });

                const result = await response.json();

                if (response.ok) {
                    // Başarılı durumu vektörel ikonla
                    mesajAlani.className = 'basarili';
                    mesajAlani.innerHTML = '<i class="fa-solid fa-circle-check"></i> Talebiniz başarıyla bize ulaştı!';
                    document.getElementById('destekFormu').reset();
                } else {
                    // Hata durumu vektörel ikonla
                    mesajAlani.className = 'hata';
                    mesajAlani.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + (result.hata || "Bir sorun oluştu.");
                }
            } catch (error) {
                mesajAlani.className = 'hata';
                mesajAlani.innerHTML = '<i class="fa-solid fa-plug-circle-xmark"></i> Sunucuya bağlanılamadı!';
            } finally {
                // İşlem bitince butonu eski haline getir
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Mesajı Gönder';
            }
        });
    </script>
</body>
</html>
